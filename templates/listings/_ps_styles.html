{% comment %}
Shared visual language for the Products & Services (Listings) module.
Scoped with a `.ps-` prefix so it never clashes with AdminLTE/Bootstrap.
Included once per listings page. Light + AdminLTE dark-mode aware.
{% endcomment %}
<style>
  :root {
    --ps-offer: #2563eb;
    --ps-offer-soft: #e0edff;
    --ps-offer-ink: #1d4ed8;
    --ps-demand: #d97706;
    --ps-demand-soft: #fdeccf;
    --ps-demand-ink: #b45309;
    --ps-surface: #ffffff;
    --ps-border: #eceef2;
    --ps-muted: #667085;
    --ps-ink: #101828;
  }

  /* ---- Hero header ---- */
  .ps-hero {
    background: linear-gradient(135deg, #4338ca 0%, #2563eb 55%, #0ea5e9 100%);
    color: #fff;
    border-radius: .85rem;
    padding: 1.5rem 1.75rem;
    box-shadow: 0 14px 34px rgba(37, 99, 235, .28);
    position: relative;
    overflow: hidden;
  }
  .ps-hero::after {
    content: "";
    position: absolute; right: -40px; top: -60px;
    width: 220px; height: 220px; border-radius: 50%;
    background: rgba(255, 255, 255, .10);
  }
  .ps-hero__icon {
    width: 58px; height: 58px; border-radius: 14px;
    background: rgba(255, 255, 255, .18);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.6rem; flex: 0 0 auto;
  }
  .ps-hero h1 { font-size: 1.6rem; font-weight: 700; margin: 0; color: #fff !important; }
  .ps-hero p { margin: .25rem 0 0; color: rgba(255, 255, 255, .88); max-width: 60ch; }
  .ps-hero .btn-light { font-weight: 600; }
  .ps-hero .btn-outline-light { font-weight: 600; }

  /* ---- Stat tiles ---- */
  .ps-stat {
    background: var(--ps-surface);
    border: 1px solid var(--ps-border);
    border-radius: .7rem;
    padding: 1rem 1.15rem;
    box-shadow: 0 4px 14px rgba(16, 24, 40, .05);
    display: flex; align-items: center; gap: .9rem; height: 100%;
  }
  .ps-stat__icon {
    width: 46px; height: 46px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.15rem; flex: 0 0 auto;
  }
  .ps-stat__num { font-size: 1.5rem; font-weight: 700; line-height: 1; color: var(--ps-ink); }
  .ps-stat__label { font-size: .78rem; color: var(--ps-muted); text-transform: uppercase; letter-spacing: .03em; }
  .ps-ic-offer { background: var(--ps-offer-soft); color: var(--ps-offer-ink); }
  .ps-ic-demand { background: var(--ps-demand-soft); color: var(--ps-demand-ink); }
  .ps-ic-total { background: #eafaf1; color: #12805c; }

  /* ---- Card grid ---- */
  .ps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
    gap: 1rem;
  }
  .ps-card {
    position: relative;
    background: var(--ps-surface);
    border: 1px solid var(--ps-border);
    border-radius: .8rem;
    padding: .85rem .95rem .9rem 1.15rem;
    box-shadow: 0 3px 12px rgba(16, 24, 40, .05);
    transition: transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s ease, border-color .22s ease;
    display: flex; flex-direction: column; min-height: 100%;
    overflow: hidden;
  }
  /* Real children sit above the ::after color wash */
  .ps-card > * { position: relative; z-index: 1; }
  /* Left accent bar — vertical gradient, widens on hover */
  .ps-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; z-index: 2;
    width: 4px; background: linear-gradient(180deg, var(--accent, var(--ps-offer)), var(--accent-2, var(--accent, var(--ps-offer))));
    transition: width .22s ease;
  }
  /* Color-graded glow that fades in from the top-right on hover */
  .ps-card::after {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(130% 90% at 100% 0%, var(--accent-soft, var(--ps-offer-soft)) 0%, transparent 58%);
    opacity: 0; transition: opacity .28s ease;
  }
  .ps-card:hover {
    transform: translateY(-5px);
    border-color: var(--accent, var(--ps-offer));
    box-shadow: 0 20px 36px -10px var(--accent-shadow, rgba(37, 99, 235, .35));
  }
  .ps-card:hover::before { width: 6px; }
  .ps-card:hover::after { opacity: 1; }
  .ps-card--offer  { --accent: #2563eb; --accent-2: #0ea5e9; --accent-soft: #e0edff; --accent-shadow: rgba(37, 99, 235, .30); }
  .ps-card--demand { --accent: #d97706; --accent-2: #f59e0b; --accent-soft: #fdeccf; --accent-shadow: rgba(217, 119, 6, .28); }
  /* Full-bleed product image header (cancels card padding) */
  .ps-card__media {
    margin: -.85rem -.95rem .7rem -1.15rem; height: 128px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #eef2f7, #e2e8f2); border-bottom: 1px solid var(--ps-border);
  }
  .ps-card__media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
  .ps-card:hover .ps-card__media img { transform: scale(1.04); }
  .ps-card__ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #b3bdcd; font-size: 2.6rem; }
  .ps-card__title { font-size: 1.02rem; font-weight: 650; margin: .1rem 0 .35rem; line-height: 1.3; }
  .ps-card__title a { color: var(--ps-ink); }
  .ps-card__title a:hover { color: var(--ps-offer); text-decoration: none; }
  .ps-card__desc { font-size: .85rem; color: var(--ps-muted); margin: 0 0 .7rem; flex-grow: 1; }
  .ps-card__meta { font-size: .8rem; color: var(--ps-muted); display: flex; flex-wrap: wrap; gap: .15rem .9rem; margin-bottom: .6rem; }
  .ps-card__meta i { width: 14px; text-align: center; margin-right: .2rem; opacity: .7; }
  .ps-card__foot {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--ps-border); padding-top: .65rem; margin-top: auto;
  }
  .ps-price { font-weight: 700; color: var(--ps-ink); font-size: .95rem; }
  .ps-price small { font-weight: 500; color: var(--ps-muted); }

  /* ---- Pills / chips / tags ---- */
  .ps-pill {
    display: inline-flex; align-items: center; gap: .3rem;
    font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: .2rem .55rem; border-radius: 999px;
  }
  .ps-pill--offer { background: var(--ps-offer-soft); color: var(--ps-offer-ink); }
  .ps-pill--demand { background: var(--ps-demand-soft); color: var(--ps-demand-ink); }
  .ps-chip {
    font-size: .68rem; font-weight: 600; color: #475467;
    background: #f2f4f7; border-radius: 999px; padding: .2rem .55rem;
  }
  .ps-tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .7rem; }
  .ps-tag {
    font-size: .7rem; color: #475467; background: #f8f9fb;
    border: 1px solid var(--ps-border); border-radius: .35rem; padding: .08rem .42rem;
  }

  /* ---- Filter toolbar ---- */
  .ps-toolbar {
    display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
    background: var(--ps-surface); border: 1px solid var(--ps-border);
    border-radius: .7rem; padding: .75rem .85rem; margin-bottom: 1.1rem;
    box-shadow: 0 3px 12px rgba(16, 24, 40, .04);
  }
  .ps-toolbar .form-control { border-radius: .5rem; }

  /* ---- Segmented tabs ---- */
  .ps-seg { display: inline-flex; background: #f2f4f7; border-radius: .6rem; padding: .2rem; gap: .15rem; }
  .ps-seg a {
    font-size: .82rem; font-weight: 600; color: #475467;
    padding: .32rem .8rem; border-radius: .45rem; text-decoration: none;
  }
  .ps-seg a.active { background: #fff; color: var(--ps-offer); box-shadow: 0 1px 3px rgba(16, 24, 40, .12); }

  /* ---- Empty state ---- */
  .ps-empty { text-align: center; padding: 3rem 1rem; color: var(--ps-muted); }
  .ps-empty i { font-size: 2.4rem; opacity: .4; margin-bottom: .6rem; }

  /* ---- Detail ---- */
  .ps-detail-head { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: .6rem; }
  .ps-panel { background: var(--ps-surface); border: 1px solid var(--ps-border); border-radius: .75rem; box-shadow: 0 3px 12px rgba(16, 24, 40, .05); }
  .ps-panel__body { padding: 1.15rem 1.3rem; }
  .ps-detail-title { font-size: 1.35rem; font-weight: 700; margin: 0 0 .8rem; line-height: 1.25; }
  .ps-detail-main { display: flex; flex-wrap: wrap; gap: 1.1rem; align-items: flex-start; }
  .ps-detail-media { flex: 0 0 220px; max-width: 220px; }
  .ps-detail-media img {
    width: 100%; height: 175px; object-fit: contain; padding: .4rem;
    background: #f7f8fa; border: 1px solid var(--ps-border); border-radius: .6rem;
  }
  .ps-detail-text { flex: 1 1 240px; min-width: 210px; }
  .ps-detail-text p { color: #344054; font-size: .92rem; margin-bottom: .6rem; white-space: pre-line; }
  .ps-extra { display: flex; flex-wrap: wrap; gap: .35rem 1.2rem; font-size: .85rem; margin-top: .3rem; }
  .ps-extra a, .ps-extra span { color: var(--ps-muted); }
  /* ---- "I am interested" card ---- */
  .ps-interest {
    border: 1px solid #cfe0ff;
    background: linear-gradient(135deg, #f4f9ff 0%, var(--ps-surface) 62%);
    border-radius: .85rem; overflow: hidden;
  }
  .ps-interest .ps-panel__body { padding: 1.15rem 1.3rem; }
  .ps-interest__head { display: flex; align-items: center; gap: .8rem; margin-bottom: .85rem; }
  .ps-interest__icon {
    width: 46px; height: 46px; border-radius: 13px; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #2563eb, #0ea5e9); color: #fff; font-size: 1.15rem;
    box-shadow: 0 9px 20px -6px rgba(37, 99, 235, .55);
  }
  .ps-interest__title { font-weight: 700; font-size: 1.04rem; margin: 0; color: var(--ps-ink); }
  .ps-interest__sub { font-size: .82rem; color: var(--ps-muted); margin: 0; line-height: 1.35; }
  .ps-interest textarea {
    border-radius: .6rem; border-color: #d5deea; resize: vertical; min-height: 62px; max-height: 130px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .ps-interest textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 .18rem rgba(37, 99, 235, .15); }
  .ps-btn-gradient {
    border: 0; color: #fff; font-weight: 600; border-radius: .6rem; padding: .55rem 1.25rem;
    background: linear-gradient(135deg, #2563eb, #0ea5e9);
    box-shadow: 0 10px 20px -8px rgba(37, 99, 235, .55);
    transition: filter .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .ps-btn-gradient:hover { filter: brightness(1.07); color: #fff; text-decoration: none; transform: translateY(-1px); box-shadow: 0 14px 26px -8px rgba(37, 99, 235, .55); }

  body.dark-mode .ps-detail-media img { background: #333e51; }
  body.dark-mode .ps-interest { border-color: #3b4759; background: linear-gradient(135deg, #26344a 0%, var(--ps-surface) 62%); }
  .ps-dl { margin: 0; }
  .ps-dl dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; color: var(--ps-muted); font-weight: 600; margin-top: .7rem; }
  .ps-dl dt:first-child { margin-top: 0; }
  .ps-dl dd { font-size: .9rem; color: var(--ps-ink); margin: .1rem 0 0; }

  /* ---- AdminLTE dark mode ---- */
  body.dark-mode {
    --ps-surface: #2b3648;
    --ps-border: #3b4759;
    --ps-muted: #a9b4c6;
    --ps-ink: #e9edf5;
  }
  body.dark-mode .ps-chip { background: #3b4759; color: #cdd6e6; }
  body.dark-mode .ps-tag { background: #333e51; color: #cdd6e6; }
  body.dark-mode .ps-toolbar,
  body.dark-mode .ps-seg { background: #2b3648; }
  body.dark-mode .ps-seg a.active { background: #1f2a3a; }
</style>
