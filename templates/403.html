{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>403 Forbidden</title>

  <link rel="stylesheet" href="{% static 'adminlte/plugins/fontawesome-free/css/all.min.css' %}">
  <link rel="stylesheet" href="{% static 'adminlte/css/adminlte.min.css' %}">
</head>

<body class="hold-transition">
<div class="wrapper">

  <div class="content-wrapper" style="margin-left:0;">
    <section class="content h-100">
      <div class="container-fluid h-100 d-flex justify-content-center">

        <div class="error-page text-center mt-5">

          <h1 class="text-danger font-weight-bold mb-3" style="font-size: 6rem;">
            403
          </h1>

          <h3 class="mb-2">
            <i class="fas fa-ban text-danger"></i>
            Access Denied
          </h3>

          <p class="text-muted">
            You do not have permission to access this page.
          </p>

          <a href="{% url 'admin:dashboard' %}" class="btn btn-primary mt-3">
            Go to Dashboard
          </a>

        </div>

      </div>
    </section>
  </div>

</div>

<script src="{% static 'adminlte/plugins/jquery/jquery.min.js' %}"></script>
<script src="{% static 'adminlte/plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'adminlte/js/adminlte.min.js' %}"></script>
</body>
</html>
