{% load static i18n %}

<form
  id="language-switcher-form"
  action="{% url 'set_language' %}"
  method="post"
  class="language-switcher-form"
>
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.get_full_path }}">
  <input type="hidden" name="language" id="language-switcher-value" value="">
</form>

<div class="dropdown language-switcher">
  <button
    type="button"
    class="header-user language-switcher__toggle"
    data-toggle="dropdown"
    aria-haspopup="true"
    aria-expanded="false"
    aria-label="{% trans "Language" context "common" %}"
  >
    <span class="language-switcher__flag" aria-hidden="true">{% include "partials/_language_flag_icon.html" with code=current_language %}</span>
    <span class="language-switcher__code">{{ current_abbr }}</span>
    <i class="fas fa-chevron-down language-switcher__caret" aria-hidden="true"></i>
  </button>
  <div class="dropdown-menu dropdown-menu-right language-switcher__menu">
    {% for language in languages %}
      <button
        type="submit"
        form="language-switcher-form"
        class="dropdown-item language-switcher__option{% if language.code == current_language %} active{% endif %}"
        onclick="document.getElementById('language-switcher-value').value='{{ language.code }}';"
      >
        <span class="language-switcher__flag" aria-hidden="true">{% include "partials/_language_flag_icon.html" with code=language.code %}</span>
        <span class="language-switcher__label">{{ language.label }}</span>
      </button>
    {% endfor %}
  </div>
</div>

<style>
  .language-switcher__toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    background: #fff;
    border: 1px solid #e2e8f0;
  }
  .language-switcher__toggle:hover,
  .language-switcher__toggle:focus {
    background: #f8fafc;
    outline: none;
  }
  .language-switcher__flag {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    line-height: 0;
  }
  .lang-flag {
    width: 20px;
    height: 15px;
    object-fit: cover;
    border-radius: 2px;
    margin-right: 8px;
    vertical-align: middle;
    flex-shrink: 0;
  }
  .language-switcher__toggle .lang-flag,
  .language-switcher__option .lang-flag {
    margin-right: 0;
  }
  .language-switcher__code {
    font-weight: 700;
    letter-spacing: 0.04em;
    min-width: 1.5rem;
    text-align: center;
  }
  .language-switcher__caret {
    font-size: 0.6rem;
    color: #94a3b8;
  }
  .language-switcher__menu {
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    padding: 8px;
    min-width: 7.5rem;
    max-width: 10rem;
    background: #fff;
  }
  .language-switcher__option {
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    background: #fff;
    width: 100%;
    text-align: left;
    border-radius: 6px;
    font-size: 0.82rem;
    padding: 8px 12px;
    color: #1b2e3f;
    cursor: pointer;
  }
  .language-switcher__label {
    flex: 1;
    min-width: 0;
  }
  .language-switcher__option::after {
    content: "";
    width: 0.85em;
    flex-shrink: 0;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1;
  }
  .language-switcher__option.active::after {
    content: "\2713";
    color: #1d4ed8;
  }
  .language-switcher__option:hover,
  .language-switcher__option:focus {
    background: #f1f5f9;
    outline: none;
  }
  .language-switcher__option.active {
    background: #eff6ff;
    color: #1d4ed8;
    font-weight: 600;
  }
</style>
