{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#253D51"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="FONTESIN"/>

  <link rel="manifest" href="{% static 'manifest.json' %}"/>
  <link rel="apple-touch-icon" href="{% static 'adminlte/images/icons/icon-192.png' %}"/>

  <title>Log In – FONTESIN</title>

  <!-- ✅ YOUR CSS -->
  <link rel="stylesheet" href="{% static 'adminlte/css/style.css' %}"/>

  <!-- OPTIONAL (for better input styling, no UI change) -->
  <link rel="stylesheet" href="{% static 'adminlte/plugins/fontawesome-free/css/all.min.css' %}">
  <link rel="stylesheet" href="{% static 'adminlte/css/adminlte.min.css' %}">

  <style>
    .auth-page-bg {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-mid) 60%, #2D4A63 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .auth-page-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: url("data:image/svg+xml,%3Csvg...");
    }
    .auth-back {
      position: absolute;
      top: 24px;
      left: 24px;
      color: rgba(255,255,255,.6);
      font-size: .85rem;
    }
    .auth-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      max-width: 900px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
    }
    .auth-left { background: var(--primary-dark); padding: 56px 48px; }
    .auth-right { background: var(--bg-white); padding: 56px 48px; }

    @media (max-width: 700px) {
      .auth-split { grid-template-columns: 1fr; }
      .auth-left { display: none; }
    }
  </style>
</head>

<body>

<div class="auth-page-bg">

  <!-- ✅ Django URL -->
  <a href="{% url 'admin:home' %}" class="auth-back">
    ← Back to Home
  </a>

  <div class="auth-split">

    <!-- LEFT -->
    <div class="auth-left">
      <img src="{% static 'adminlte/images/fontesin-logo.png' %}" style="height:36px;filter:brightness(0) invert(1);"/>
      <h3 style="color:#fff;margin-top:20px;">Welcome back</h3>
    </div>

    <!-- RIGHT -->
    <div class="auth-right">

      <h2>Log In</h2>

      <!-- ✅ Messages -->
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <!-- ✅ FORM -->
      <form id="login-form" method="post">
        {% csrf_token %}

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" class="form-control" required/>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" id="password-field" class="form-control" required/>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;">
          Log In
        </button>

      </form>

    </div>
  </div>
</div>

<!-- ✅ FIXED STATIC JS -->
<script src="{% static 'js/main.js' %}"></script>

<!-- ❌ REMOVED FAKE LOGIN JS -->

<!-- ✅ SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("{% static 'sw.js' %}");
  });
}
</script>

</body>
</html>
