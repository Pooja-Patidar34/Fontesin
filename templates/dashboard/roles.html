{% extends "base/base.html" %}
{% block title %}Roles{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h3 class="card-title">Roles</h3>
  </div>

  <div class="card-body">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Name</th>
        </tr>
      </thead>
      <tbody>
        {% for role in roles %}
        <tr>
          <td>{{ role.name }}</td>
        </tr>
        {% empty %}
        <tr>
          <td class="text-center">No roles found</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
