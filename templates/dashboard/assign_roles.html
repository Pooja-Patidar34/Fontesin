{% extends "base/base.html" %}
{% block title %}Assign Roles{% endblock %}

{% block content %}
<div class="container-fluid">

  <div class="row mb-3">
    <div class="col-sm-6">
      <h1 class="m-0">Assign Roles</h1>
    </div>
  </div>

  <div class="card">
    <form method="post">
      {% csrf_token %}

      <div class="card-header">
        <h3 class="card-title mb-0">
          {{ user.email }}
          <small class="text-muted">
            ({{ user.tenant.name }})
          </small>
        </h3>
      </div>

      <div class="card-body">

        {% for role in roles %}
        <div class="form-check mb-2">
          <input
            type="checkbox"
            class="form-check-input"
            name="roles"
            value="{{ role.id }}"
            id="role_{{ role.id }}"
            {% if role.id in assigned_role_ids %}checked{% endif %}
          >
          <label class="form-check-label" for="role_{{ role.id }}">
            {{ role.name|capfirst }}
          </label>
        </div>
        {% empty %}
        <p class="text-muted">No roles available.</p>
        {% endfor %}

      </div>

      <div class="card-footer d-flex justify-content-between">
        <a href="{% url 'admin:users' %}" class="btn btn-secondary">
          Cancel
        </a>
        <button type="submit" class="btn btn-primary">
          Save Roles
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
