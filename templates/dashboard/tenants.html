{% extends "base/base.html" %}
{% block title %}Tenants{% endblock %}

{% block content %}

<div class="card card-outline card-primary shadow-sm">

  <!-- Header -->
  <div class="card-header d-flex align-items-center">
    <h3 class="card-title font-weight-bold mb-0">
      Tenants
    </h3>

  <div class="ml-auto d-flex align-items-center">

    <form method="get" class="mr-2" id="tenant-search-form">
      <div class="input-group input-group-sm" style="width:220px;">
        <input type="text"
              name="q"
              id="tenant-search"
              value="{{ request.GET.q }}"
              class="form-control"
              placeholder="Search tenant..."
              autocomplete="off">

        <div class="input-group-append">
          <button class="btn btn-outline-secondary" type="submit">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>
    </form>

    <button class="btn btn-primary btn-sm shadow-sm"
            id="add-tenant-btn">
      <i class="fas fa-plus mr-1"></i> Add Tenant
    </button>

  </div>
  </div>

  <div id="tenants-panel">
    {% include "dashboard/_tenants_panel.html" %}
  </div>

</div>


<!-- Modal (Create + Update) -->
<div class="modal fade" id="tenantModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="tenant_id" id="tenant-id-field">

        <div class="modal-header">
          <h5 class="modal-title font-weight-bold">
            Add Tenant
          </h5>
          <button type="button" class="close" data-dismiss="modal">
            &times;
          </button>
        </div>

        <div class="modal-body">

          <div class="form-group">
            <label>Name</label>
            {{ form.name }}
            <div id="tenant-name-readonly"
                 style="display:none; margin-top:.25rem; padding:.5rem .75rem;
                        background:#f8f9fa; border:1px solid #e2e8f0; border-radius:.25rem;
                        word-break:break-word; overflow-wrap:anywhere; color:#374151; font-weight:500;"></div>
          </div>

          <div class="form-check">
            {{ form.is_active }}
            <label class="form-check-label ml-1">
              Active
            </label>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button"
                  class="btn btn-secondary btn-sm"
                  data-dismiss="modal">
            Cancel
          </button>

          <button type="submit"
                  class="btn btn-primary btn-sm">
            Save Tenant
          </button>
        </div>

      </form>

    </div>
  </div>
</div>


<!-- JS -->
<script>

  function setReadonly(state) {

      const nameField = document.getElementById("id_name");
      const nameReadonly = document.getElementById("tenant-name-readonly");
      const activeField = document.getElementById("id_is_active");
      const saveBtn = document.querySelector(".modal-footer .btn-primary");

      if (state) {
          // View mode: hide single-line input, show wrappable display
          nameField.style.display = "none";
          if (nameReadonly) {
              nameReadonly.textContent = nameField.value || "—";
              nameReadonly.style.display = "block";
          }
          nameField.readOnly = true;
          nameField.blur();
          nameField.style.pointerEvents = "none";

          activeField.disabled = true;
      } else {
          // Add / Edit mode: show input, hide wrappable display
          nameField.style.display = "";
          if (nameReadonly) {
              nameReadonly.style.display = "none";
              nameReadonly.textContent = "";
          }
          nameField.readOnly = false;
          nameField.style.pointerEvents = "auto";

          activeField.disabled = false;
      }

      if (saveBtn) {
          saveBtn.style.display = state ? "none" : "inline-block";
      }
  }

  document.addEventListener("DOMContentLoaded", function () {

    const modal = $('#tenantModal');

  document.getElementById("add-tenant-btn").addEventListener("click", function () {

      document.getElementById("tenant-id-field").value = "";
      document.getElementById("id_name").value = "";
      document.getElementById("id_is_active").checked = true;

      document.querySelector(".modal-title").innerText = "Add Tenant";

      setReadonly(false);

      modal.modal('show');
  });

  // Event delegation so view/edit buttons keep working after AJAX panel swaps.
  const panel = document.getElementById("tenants-panel");
  panel?.addEventListener("click", function (e) {
    const viewBtn = e.target.closest(".view-tenant-btn");
    const editBtn = e.target.closest(".edit-tenant-btn");
    const btn = viewBtn || editBtn;
    if (!btn) return;

    fetch(btn.dataset.url)
      .then(response => response.json())
      .then(data => {
        document.getElementById("tenant-id-field").value = data.id;
        document.getElementById("id_name").value = data.name;
        document.getElementById("id_is_active").checked = data.is_active;

        document.querySelector(".modal-title").innerText = viewBtn ? "Tenant Details" : "Edit Tenant";
        setReadonly(!!viewBtn);
        modal.modal('show');
      });
  });
  });

  document.querySelector("#tenantModal form").addEventListener("submit", function(e) {
      if (this.dataset.readonly === "true") {
          e.preventDefault();
      }
  });

  function debounce(func, delay) {
      let timer;
      return function () {
          const context = this;
          const args = arguments;

          clearTimeout(timer);
          timer = setTimeout(() => {
              func.apply(context, args);
          }, delay);
      };
  }

  // --- AJAX search: swap only the tenants-panel instead of reloading the page ---
  document.addEventListener("DOMContentLoaded", function () {

      const searchInput = document.getElementById("tenant-search");
      const form = document.getElementById("tenant-search-form");
      const tenantsPanel = document.getElementById("tenants-panel");

      let lastQuery = (new URLSearchParams(window.location.search).get("q") || "").trim();

      function runSearch() {
          const q = (searchInput?.value || "").trim();

          // No-op when the query hasn't changed (e.g. empty submit on an unfiltered list,
          // or re-submitting the same term). Avoids a pointless round-trip and flicker.
          if (q === lastQuery) return;
          lastQuery = q;

          const params = new URLSearchParams();
          if (q) params.set("q", q);
          const qs = params.toString();
          const url = window.location.pathname + (qs ? "?" + qs : "");

          fetch(url, {
            headers: { "X-Requested-With": "XMLHttpRequest", "Accept": "text/html" },
            credentials: "same-origin",
          })
            .then(res => {
              if (!res.ok) throw new Error("HTTP " + res.status);
              return res.text();
            })
            .then(html => {
              tenantsPanel.innerHTML = html;
              // Reflect the current query in the browser URL so refresh / sharing works.
              window.history.replaceState({}, "", url);
            })
            .catch(err => {
              console.error("Tenant search failed:", err);
              if (typeof showToast === "function") {
                showToast("Search failed. Please try again.", "error");
              }
            });
      }

      form?.addEventListener("submit", function (e) {
          e.preventDefault();
          runSearch();
      });

      searchInput?.addEventListener("input", debounce(runSearch, 400));

  });
</script>

{% endblock %}
